name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage
        uses: actions/checkout@v6

      - name: Read pinned private blog revision
        id: private-blog
        run: echo "sha=$(git rev-parse HEAD:_private/pages-private-submodule-beta)" >> "$GITHUB_OUTPUT"

      - name: Check out private beta blog
        uses: actions/checkout@v6
        with:
          repository: kiddyboots216/pages-private-submodule-beta
          ref: ${{ steps.private-blog.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_BLOG_DEPLOY_KEY }}
          path: _private/pages-private-submodule-beta

      - name: Assemble public site
        run: |
          mkdir -p _site/blogs/private-submodule-beta
          cp index.html stylesheet.css _site/
          cp -R data images _site/
          cp blogs/index.html _site/blogs/index.html
          cp _private/pages-private-submodule-beta/index.html _site/blogs/private-submodule-beta/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
